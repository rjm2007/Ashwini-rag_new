# Standalone Docling Serve (CPU) — official image
# Usage:
#   docker compose -f docker-compose.docling.yml up -d
#   curl http://localhost:5001/docs

services:
  docling-service:
    image: quay.io/docling-project/docling-serve
    container_name: docling-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      UVICORN_WORKERS: "1"
      DOCLING_NUM_THREADS: "4"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
