services:
  postgres:
    image: postgres:15
    container_name: warranty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: warranty
      POSTGRES_USER: warranty_user
      POSTGRES_PASSWORD: warranty_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - warranty-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: warranty-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - warranty-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warranty-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - warranty-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: warranty-ai-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_DIR: /app/logs
    volumes:
      - ./logs/services/ai-service:/app/logs
    depends_on:
      - postgres
      - qdrant
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    networks:
      - warranty-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: warranty-frontend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - warranty-net

volumes:
  postgres_data:
  qdrant_data:

networks:
  warranty-net:
    driver: bridge
