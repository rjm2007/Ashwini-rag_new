# docker-compose.docling.yml
#
# Standalone compose for the Docling PDF extraction service.
#
# Usage (standalone):
#   docker compose -f docker-compose.docling.yml up --build
#
# Or merge the 'docling' service block into your main docker-compose.yml
# (see the comment block at the bottom of this file).
#
# First build takes 5-10 min (downloads ~1GB of AI models).
# Subsequent starts are fast (<30s).

services:
  docling:
    build:
      context: ./docling-service
      dockerfile: Dockerfile
    container_name: warranty-docling
    restart: unless-stopped
    ports:
      - "5001:5001"
    # Docling holds ~1.5GB in memory for its AI models.
    # Set a memory limit so it doesn't starve other containers.
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # models take ~30s to load on warm cache
    networks:
      - warranty-net

networks:
  warranty-net:
    driver: bridge


# ─────────────────────────────────────────────────────────────
# TO ADD TO YOUR MAIN docker-compose.yml:
#
# Paste this block under 'services:' in warranty-platform/docker-compose.yml:
#
#   docling:
#     build:
#       context: ./docling-service
#       dockerfile: Dockerfile
#     container_name: warranty-docling
#     restart: unless-stopped
#     ports:
#       - "5001:5001"
#     deploy:
#       resources:
#         limits:
#           memory: 3G
#         reservations:
#           memory: 1536M
#     healthcheck:
#       test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
#       interval: 30s
#       timeout: 10s
#       retries: 3
#       start_period: 60s
#     networks:
#       - warranty-net
#
# Then add to your .env:
